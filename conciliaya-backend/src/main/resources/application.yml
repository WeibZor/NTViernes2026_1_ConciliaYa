spring:
  application:
    name: conciliaya-backend
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
  datasource:
    url: jdbc:postgresql://localhost:5432/conciliaya_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # Para MySQL descomentar y modificar PostgreSQL
  # datasource:
  #   url: jdbc:mysql://localhost:3306/conciliaya_db
  #   username: root
  #   password: password
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  # jpa:
  #   properties:
  #     hibernate:
  #       dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.conciliaya: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Cliente FastAPI Python
fastapi:
  url: http://localhost:8000
  classifier-endpoint: /api/v1/classify-conflict
  timeout: 5000

---
spring:
  config:
    activate:
      on-profile: dev

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

logging:
  level:
    com.conciliaya: INFO
